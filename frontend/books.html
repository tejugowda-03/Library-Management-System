<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books - Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div class="logo">
                <h2>📚 Library MS</h2>
            </div>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="books.html" class="active">Books</a>
                <a href="members.html">Members</a>
                <a href="issue.html">Issue Book</a>
                <a href="return.html">Return Book</a>
                <a href="reports.html">Reports</a>
                <a href="#" onclick="logout()" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">📖 Add New Book</div>
            <div id="message"></div>
            <form id="bookForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Book Title *</label>
                        <input type="text" id="title" required placeholder="Enter book title">
                    </div>
                    <div class="form-group">
                        <label>Author *</label>
                        <input type="text" id="author" required placeholder="Enter author name">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>ISBN *</label>
                        <input type="text" id="isbn" required placeholder="Enter ISBN">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category">
                            <option value="Fiction">Fiction</option>
                            <option value="Non-Fiction">Non-Fiction</option>
                            <option value="Science">Science</option>
                            <option value="Technology">Technology</option>
                            <option value="History">History</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Total Copies</label>
                        <input type="number" id="totalCopies" value="1" min="1">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">➕ Add Book</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header">📚 Book List</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search books by title or author...">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>ISBN</th>
                            <th>Category</th>
                            <th>Copies</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="booksTableBody">
                        <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        checkAuth();
        loadBooks();
        
        // Handle form submission
        document.getElementById('bookForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '<div class="alert alert-info">Adding book...</div>';
            
            const bookData = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                isbn: document.getElementById('isbn').value,
                category: document.getElementById('category').value,
                totalCopies: parseInt(document.getElementById('totalCopies').value)
            };
            
            try {
                const response = await fetch('https://library-management-system-1npg.onrender.com/api/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = `<div class="alert alert-success">✅ Success! Book "${result.title}" added successfully!</div>`;
                    document.getElementById('bookForm').reset();
                    loadBooks();
                    loadDashboardStats();
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-error">❌ Error: ${result.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-error">❌ Error: ${error.message}</div>`;
            }
        });
        
        document.getElementById('searchInput').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const rows = document.querySelectorAll('#booksTableBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
